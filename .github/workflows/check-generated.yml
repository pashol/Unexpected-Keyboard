name: Check generated files

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  gen-layouts:
    name: Layout list
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 gen_layouts.py
    - name: "Run 'python3 gen_layouts.py' to update the generated files."
      run: git diff --exit-code

  check-layouts:
    name: Layout warnings
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 check_layout.py
    - name: "Fix your layout accordingly or run 'python3 check_layout.py' to promote the warnings"
      run: git diff --exit-code

  check-compose:
    name: Compose key data
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 srcs/compose/compile.py srcs/compose/{*.json,compose} > srcs/juloo.keyboard2/ComposeKeyData.java
    - name: "Run 'gradle test' to update the generated files."
      run: git diff --exit-code

  verify-language-pack:
    name: Language pack fixture
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Checkout pinned AOSP LatinIME
      run: |
        git clone https://android.googlesource.com/platform/packages/inputmethods/LatinIME.git "$RUNNER_TEMP/LatinIME"
        git -C "$RUNNER_TEMP/LatinIME" checkout 8081a1d8572f78488900438a6eaaec232b882bbf
    - name: Verify language-pack fixture
      run: python3 -m unittest tools.prediction.integration_test_build_language_pack
      env:
        AOSP_LATINIME_SOURCE: ${{ runner.temp }}/LatinIME
